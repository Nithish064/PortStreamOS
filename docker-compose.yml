version: '3.8'

services:
  # ------------------------------------
  # PostgreSQL (Database per service)
  # ------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: portstream_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portstream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ------------------------------------
  # Redis (Caching & Heatmaps)
  # ------------------------------------
  redis:
    image: redis:7-alpine
    container_name: portstream_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ------------------------------------
  # Zookeeper (Required for Kafka)
  # ------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: portstream_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ------------------------------------
  # Kafka (Message Broker / Events)
  # ------------------------------------
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: portstream_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
  redis_data:
